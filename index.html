<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="#home">Home</a>    
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
    </nav>
    
    <div class="container" id="home">
        <h1>Meu Primeiro Site</h1>
        <p>Feito por Daniel</p>

        <button onclick="mostrarMensagem()">Clique aqui</button>
        <p id="mensagem"></p>

        <img src="imagens/foto.png" width="300">

    </div>

    <div class="container" id="sobre">
        <h2>Sobre</h2>
        <p>Sou iniciante em programação e estou aprendendo a criar sites</p>
    </div>

    <div class="container" id="contato">
        <h2>Contato</h2>
        <p>Email: ffjoker101@gmail.com</p>
    </div>

    <a href="https://github.com/danielnunes-code" target="_blank">
        Meu GitHub
    </a>
    
    <script>
        function mostrarMensagem(){
            document.getElementById("mensagem").innerText = "Você clicou no botão";
        }
    </script>

    <script>
        const sections = document.querySelectorAll("div[id]");
        const navLinks = document.querySelectorAll("nav a");

        window.addEventListener("scroll", () => {
            let current = "";

            sections.forEach(section => {
                const sectionTop = section.offsetTop - 80;
                if (window.scrollY >= sectionTop) {
                    current = section.getAttribute("id");
                }
            });

            navLinks.forEach(link => {
                link.classList.remove("active");
                if (link.getAttribute("href") === "#" + current) {
                    link.classList.add("active");
                }
            });
        });
    </script>


</body>
</html>
